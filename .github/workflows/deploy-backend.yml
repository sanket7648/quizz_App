name: Deploy Backend to Hugging Face

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**' # Only triggers when you change backend code

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace YOUR_HF_USERNAME and YOUR_SPACE_NAME below!
          HF_USERNAME="YOUR_HF_USERNAME"
          SPACE_NAME="YOUR_SPACE_NAME"
          
          # Clone your blank Hugging Face Space
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$SPACE_NAME space_repo
          
          # Copy everything from your backend folder into the root of the Space
          cp -a backend/. space_repo/
          
          # Commit and push the changes to Hugging Face
          cd space_repo
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .
          git commit -m "Auto-deployed from GitHub Actions" || echo "No changes to commit"
          git push